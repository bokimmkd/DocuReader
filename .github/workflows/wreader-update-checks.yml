name: W Reader update mechanism checks (NO AAB)
on:
  push:
    branches: [fix/wreader-play-updates-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests (no release bundle)
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SDK simulation with real Android lifecycle and banner UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/run-update-tests.sh
      - name: Upload test reports and UI evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WReader-update-test-evidence
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            verification/android-update
          if-no-files-found: warn
