name: W Reader 0.1.5 AdMob configuration verification
on:
  push:
    branches: [feature/wreader-admob-0.1.5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-admob-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle required offline Office engines
        run: bash scripts/prepare-office-assets.sh
      - name: Check and compile debug, unit tests and unsigned release bundle
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Ensure safe disabled-by-default release and valid AAB structure
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tqq app/build/outputs/bundle/release/app-release.aab
          grep -q 'MONETIZATION_ENABLED' app/build.gradle.kts && exit 1 || true
          echo 'Passed: release AdMob requires explicit real IDs; purchases remain disabled.'
          echo 'Unsigned AAB is not ready for Play upload. Existing accepted 0.1.4 must not be replaced.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-0.1.5-AdMob-ready-UNSIGNED-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
