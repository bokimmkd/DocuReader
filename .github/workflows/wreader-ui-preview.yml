name: W Reader UI and navigation bar emulator check
on:
  push:
    branches: [feature/wreader-ui-0.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and build preview
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Prepare Android emulator acceleration
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture Android 36 dark UI with 3-button navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p verification/ui
            adb shell cmd uimode night yes
            adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.blw.documentreader || true
            adb shell am start -W -n com.blw.documentreader/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/wreader-home.png
            adb pull /sdcard/wreader-home.png verification/ui/home.png
            # pixel_6 emulator has a verified 1080x2400 display; Settings clickable
            # accessibility bounds: [708,2161][1043,2319].
            # Each script line runs in its own shell, so do not use cross-line W/H variables.
            adb shell input tap 875 2250
            sleep 4
            adb shell uiautomator dump /sdcard/wreader-window.xml
            adb pull /sdcard/wreader-window.xml verification/ui/window.xml
            adb shell screencap -p /sdcard/wreader-settings.png
            adb pull /sdcard/wreader-settings.png verification/ui/settings.png
            # The screenshot must actually show Settings, not Home after a missed tap.
            grep -q 'Appearance' verification/ui/window.xml
      - name: Upload Android emulator UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-0.1.1-UI-screenshots
          path: verification/ui/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-UI-0.1.1-preview-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
