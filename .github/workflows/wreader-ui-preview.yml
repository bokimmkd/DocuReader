name: W Reader UI and navigation bar emulator check
on:
  push:
    branches: [feature/wreader-ui-0.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and build preview
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Prepare Android emulator acceleration
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture API 36 Home and Settings screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p verification/ui
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.blw.documentreader/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/wreader-home.png
            adb pull /sdcard/wreader-home.png verification/ui/home.png
            H=$(adb shell wm size | grep Physical | sed 's/.*x//')
            W=$(adb shell wm size | grep Physical | sed 's/.*: //' | cut -d'x' -f1)
            adb shell input tap $((W * 5 / 6)) $((H - 175))
            sleep 2
            adb shell screencap -p /sdcard/wreader-settings.png
            adb pull /sdcard/wreader-settings.png verification/ui/settings.png
      - name: Upload Android emulator UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-0.1.1-UI-screenshots
          path: verification/ui/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-UI-0.1.1-preview-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
