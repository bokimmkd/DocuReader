name: W Reader launcher shortcuts QA
on:
  push:
    branches: [feature/wreader-launcher-shortcuts]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wreader-shortcuts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify shortcut destinations and lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.blw.documentreader.LauncherShortcutsTest --stacktrace --no-daemon
            mkdir -p verification/shortcuts
            adb pull /sdcard/Android/data/com.blw.wreader/files/shortcut-qa verification/shortcuts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-launcher-shortcuts-QA
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            verification/shortcuts

