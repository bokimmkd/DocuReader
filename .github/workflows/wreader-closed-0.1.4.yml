name: W Reader 0.1.13 - Attachment, billing and PDF fixes (unsigned)
on:
  push:
    branches: [release/wreader-closed-0.1.4, fix/wreader-0113-viber-billing-zoom-excel]
  workflow_dispatch:
concurrency:
  group: wreader-closed-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Package pinned offline readers, PDF engine and licensed fonts
        run: |
          bash scripts/prepare-office-assets.sh
          node --check app/src/main/assets/office/reader.js
          node --check app/src/main/assets/pdf/export.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Office and extended-format print fixtures
        run: |
          python -m pip install python-docx openpyxl pillow python-pptx
          python scripts/create-print-fixtures.py
          python scripts/create-format-fixtures.py
      - name: Check whether the already-passed Android QA inputs are identical
        id: qa
        run: |
          if git diff --quiet ad295e8318c0fb8272db8009c3971f57bcba2962 HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties scripts/prepare-office-assets.sh scripts/create-print-fixtures.py scripts/create-format-fixtures.py; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retrieve the passed Android baseline for identical inputs
        if: steps.qa.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: WReader-0.1.11-test-evidence
          run-id: 41270899777
          github-token: ${{ github.token }}
          path: verification/prior-qa
      - name: Validate the prior full-suite XML before reusing it
        if: steps.qa.outputs.reuse == 'true'
        run: python scripts/verify-qa-baseline.py
      - name: Test and build UNSIGNED closed-test Android App Bundle
        run: |
          if [ '${{ steps.qa.outputs.reuse }}' = 'true' ]; then
            gradle :app:testDebugUnitTest :app:bundleRelease --stacktrace --no-daemon
          else
            gradle :app:testDebugUnitTest :app:bundleRelease :app:assembleQa :app:assembleQaAndroidTest -PreaderTestBuildType=qa --stacktrace --no-daemon
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare actual release-AAB APK for black-box verification
        run: |
          mkdir -p verification
          if ! command -v tesseract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr; fi
          keytool -genkeypair -keystore verification/release-smoke.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 30
          curl --fail --location --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o verification/bundletool.jar
          java -Xmx1g -jar verification/bundletool.jar build-apks --bundle=app/build/outputs/bundle/release/app-release.aab --output=verification/release.apks --mode=universal --ks=verification/release-smoke.keystore --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p verification/release.apks universal.apk > verification/release-universal.apk
      - name: Verify readers, direct PDF saving, printing, Open with, Settings and update lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: env READER_TEST_VARIANT=Qa READER_REUSE_QA=${{ steps.qa.outputs.reuse }} bash scripts/run-print-tests.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WReader-0.1.13-test-evidence
          path: |
            app/build/reports/androidTests
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/outputs/androidTest-results
            verification/android-print
            verification/qa-baseline.json
            verification/prior-qa
            app/build/outputs/mapping/release
            app/build/outputs/mapping/qa
          if-no-files-found: warn
      - name: Verify outputs
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tqq app/build/outputs/bundle/release/app-release.aab
          echo 'Unsigned AAB created; sign privately off GitHub Actions before Play upload.'
          sha256sum app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WReader-0.1.13-closed-test-UNSIGNED-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
