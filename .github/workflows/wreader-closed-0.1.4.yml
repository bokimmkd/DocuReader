name: W Reader 0.1.9 - Google Play Closed Testing AAB (unsigned)
on:
  push:
    branches: [release/wreader-closed-0.1.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Package pinned offline Word and Excel engines
        run: |
          bash scripts/prepare-office-assets.sh
          node --check app/src/main/assets/office/reader.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Office and extended-format print fixtures
        run: |
          python -m pip install python-docx openpyxl pillow python-pptx
          python scripts/create-print-fixtures.py
          python scripts/create-format-fixtures.py
      - name: Test and build UNSIGNED closed-test Android App Bundle
        run: gradle :app:testDebugUnitTest :app:bundleRelease --stacktrace --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify readers, printing, Open with, Settings and update lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/run-print-tests.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WReader-0.1.9-test-evidence
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            verification/android-print
          if-no-files-found: warn
      - name: Verify outputs
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tqq app/build/outputs/bundle/release/app-release.aab
          echo 'Unsigned AAB created; sign privately off GitHub Actions before Play upload.'
          sha256sum app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WReader-0.1.9-closed-test-UNSIGNED-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
