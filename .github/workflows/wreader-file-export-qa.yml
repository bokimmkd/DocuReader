name: W Reader 0.1.10 direct PDF and reader checks (debug only)
on:
  push:
    branches: [feature/wreader-0110-file-export]
    paths: ['app/**', 'scripts/**', '.github/workflows/wreader-file-export-qa.yml']
permissions:
  contents: read
jobs:
  file-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle licensed local renderers and fonts
        run: |
          bash scripts/prepare-office-assets.sh
          node --check app/src/main/assets/office/reader.js
          node --check app/src/main/assets/pdf/export.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make document fixtures
        run: |
          python -m pip install python-docx openpyxl pillow python-pptx
          python scripts/create-print-fixtures.py
          python scripts/create-format-fixtures.py
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real saved PDF bytes, picker, actions, images and category edits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash scripts/run-file-export-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader0110-file-export-evidence
          path: |
            verification/file-export
            app/build/outputs/androidTest-results
