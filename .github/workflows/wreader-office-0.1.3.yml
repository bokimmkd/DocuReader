name: W Reader 0.1.3 Word Excel and PDF scroll debug
on:
  push:
    branches: [feature/wreader-office-scroll-0.1.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle pinned Apache and MIT Office renderer engines
        run: |
          bash scripts/prepare-office-assets.sh
          node --check app/src/main/assets/office/reader.js
          test -s app/src/main/assets/office/docx-preview.min.js
          test -s app/src/main/assets/office/jszip.min.js
          test -s app/src/main/assets/office/exceljs.min.js
          test -s app/src/main/assets/office/licenses/docx-preview-APACHE-2.0.txt
          test -s app/src/main/assets/office/licenses/exceljs-MIT.txt
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Make real sample Office documents and PDF
        run: |
          python3 -m pip install -q --disable-pip-version-check --break-system-packages python-docx openpyxl reportlab
          python3 scripts/create-office-qa-fixtures.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android 36 offline document smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p verification/screenshots
            adb shell cmd uimode night no
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.blw.documentreader mkdir -p files/library
            adb push verification/fixtures/word.docx /data/local/tmp/wr_word.docx
            adb push verification/fixtures/excel.xlsx /data/local/tmp/wr_excel.xlsx
            adb push verification/fixtures/pages.pdf /data/local/tmp/wr_pages.pdf
            adb shell run-as com.blw.documentreader cp /data/local/tmp/wr_word.docx files/library/word.docx
            adb shell run-as com.blw.documentreader cp /data/local/tmp/wr_excel.xlsx files/library/excel.xlsx
            adb shell run-as com.blw.documentreader cp /data/local/tmp/wr_pages.pdf files/library/pages.pdf
            adb shell am force-stop com.blw.documentreader
            adb shell am start -W -n com.blw.documentreader/.MainActivity -a android.intent.action.VIEW -d content://com.blw.documentreader.files/saved-documents/word.docx -t application/vnd.openxmlformats-officedocument.wordprocessingml.document
            sleep 10
            adb shell screencap -p /sdcard/word.png
            adb pull /sdcard/word.png verification/screenshots/word.png
            adb shell uiautomator dump /sdcard/word.xml
            adb pull /sdcard/word.xml verification/screenshots/word.xml
            grep -q 'Word' verification/screenshots/word.xml
            adb shell am force-stop com.blw.documentreader
            adb shell am start -W -n com.blw.documentreader/.MainActivity -a android.intent.action.VIEW -d content://com.blw.documentreader.files/saved-documents/excel.xlsx -t application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            sleep 12
            adb shell screencap -p /sdcard/excel.png
            adb pull /sdcard/excel.png verification/screenshots/excel.png
            adb shell uiautomator dump /sdcard/excel.xml
            adb pull /sdcard/excel.xml verification/screenshots/excel.xml
            grep -q 'Excel' verification/screenshots/excel.xml
            adb shell am force-stop com.blw.documentreader
            adb shell am start -W -n com.blw.documentreader/.MainActivity -a android.intent.action.VIEW -d content://com.blw.documentreader.files/saved-documents/pages.pdf -t application/pdf
            sleep 6
            adb shell screencap -p /sdcard/pdf-start.png
            adb pull /sdcard/pdf-start.png verification/screenshots/pdf-before-scroll.png
            adb shell input swipe 400 1700 400 450 700
            sleep 4
            adb shell screencap -p /sdcard/pdf-scroll.png
            adb pull /sdcard/pdf-scroll.png verification/screenshots/pdf-after-scroll.png
            adb shell uiautomator dump /sdcard/pdf.xml
            adb pull /sdcard/pdf.xml verification/screenshots/pdf.xml
      - name: Upload Office and PDF emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WReader-0.1.3-Office-PDF-scroll-screenshots
          path: verification/screenshots/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-0.1.3-Office-PDFScroll-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
