name: W Reader 0.1.2 Library Preview Android QA
on:
  push:
    branches: [feature/wreader-library-0.1.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Enable emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android 36 UI acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p verification/ui
            adb shell cmd uimode night yes
            adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.blw.documentreader/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png verification/ui/home.png
            adb shell input tap 405 2250
            sleep 3
            adb shell uiautomator dump /sdcard/library.xml
            adb pull /sdcard/library.xml verification/ui/library.xml
            grep -q 'Search name, category or tags' verification/ui/library.xml
            adb shell screencap -p /sdcard/library.png
            adb pull /sdcard/library.png verification/ui/library.png
            adb shell input tap 680 2250
            sleep 3
            adb shell screencap -p /sdcard/tools.png
            adb pull /sdcard/tools.png verification/ui/tools.png
            adb shell input tap 945 2250
            sleep 3
            adb shell uiautomator dump /sdcard/settings.xml
            adb pull /sdcard/settings.xml verification/ui/settings.xml
            grep -q 'Appearance' verification/ui/settings.xml
            adb shell screencap -p /sdcard/settings.png
            adb pull /sdcard/settings.png verification/ui/settings.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-0.1.2-UI-screenshots
          path: verification/ui/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-0.1.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
