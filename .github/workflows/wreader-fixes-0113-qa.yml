name: W Reader targeted fixes QA (no release)
on:
  # Full release workflow now runs all of these tests on branch pushes.
  workflow_dispatch:
concurrency:
  group: wreader-0113-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Package offline document rendering engines
        run: |
          bash scripts/prepare-office-assets.sh
          node --check app/src/main/assets/office/reader.js
          node --check app/src/main/assets/pdf/export.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create existing Android test fixtures
        run: |
          python -m pip install -q python-docx openpyxl pillow python-pptx
          python scripts/create-print-fixtures.py
          python scripts/create-format-fixtures.py
      - name: Unit tests and QA APK compilation
        run: gradle :app:testDebugUnitTest :app:assembleQa :app:assembleQaAndroidTest -PreaderTestBuildType=qa --stacktrace --no-daemon
      - name: Emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android integration and wide-invoice export tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: env READER_TEST_VARIANT=Qa READER_REUSE_QA=false bash scripts/run-print-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-0113-fixes-QA-evidence
          path: |
            app/build/reports/androidTests
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/outputs/androidTest-results
            verification/android-print
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WReader-0113-fixes-QA-APK-not-for-Play
          path: app/build/outputs/apk/qa/*.apk
          retention-days: 14
          if-no-files-found: error
