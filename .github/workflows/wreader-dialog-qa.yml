name: W Reader branded document dialog checks (NO AAB)
on:
  push:
    branches: [feature/wreader-document-dialog]
    paths:
      - 'app/src/main/java/com/blw/documentreader/ui/DocumentEditDialog.kt'
      - 'app/src/main/java/com/blw/documentreader/ui/LibraryScreen.kt'
      - 'app/src/debug/**'
      - 'app/src/androidTest/java/com/blw/documentreader/DocumentDialogTest.kt'
      - '.github/workflows/wreader-dialog-qa.yml'
      - 'scripts/run-dialog-tests.sh'
permissions:
  contents: read
jobs:
  document-dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify category dropdown and real metadata edits in Light and Dark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/run-dialog-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WReader-document-dialog-qa
          path: |
            verification/document-dialog
            app/build/outputs/androidTest-results
