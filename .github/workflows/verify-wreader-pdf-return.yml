name: Verify W Reader PDF return
on:
  pull_request:
    branches: [fix/wreader-0113-viber-billing-zoom-excel]
    paths:
      - 'app/src/main/java/com/blw/documentreader/MainActivity.kt'
      - '.github/workflows/verify-wreader-pdf-return.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare offline readers
        run: bash scripts/prepare-office-assets.sh
      - name: Verify Android compilation and unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
